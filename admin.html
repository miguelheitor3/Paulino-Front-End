<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Admin — Paulino Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Biblioteca para gerar arquivos Excel (XLSX) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --green:#0C3B2C; --green-dark:#082B20; --red:#C81E2C;
    --ink:#121815; --ink-soft:#5C665F; --line:#E3E7E2; --offwhite:#F6F7F5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--offwhite);}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px;}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;margin-bottom:24px;}
  h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;margin-bottom:14px;}

  #tela-login{max-width:340px;margin:100px auto;background:#fff;padding:32px;border-radius:12px;border:1px solid var(--line);}
  #tela-login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:14px;}
  #tela-login button{width:100%;padding:12px;background:var(--green);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;}
  .erro{color:var(--red);font-size:13px;margin-bottom:10px;}

  #app{display:none;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  .btn{padding:10px 16px;border-radius:8px;border:0;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}

  .card-form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:32px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
  .form-grid.full{grid-template-columns:1fr;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{min-height:80px;resize:vertical;}
  .check-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .msg{font-size:13px;margin-bottom:12px;}
  .msg.ok{color:var(--green);}
  .msg.erro{color:var(--red);}

  /* Painel de Filtros e Busca */
  .filtros-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .filtros-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:12px;align-items:end;}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th,td{padding:12px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{background:#fafbfa;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  tr:last-child td{border-bottom:none;}
  .thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;background:#eee;}
  .status{display:inline-block;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:600;}
  .status.disp{background:#E8EFEA;color:var(--green);}
  .status.vend{background:#FBE8E9;color:var(--red);}
  .acoes{display:flex;gap:6px;flex-wrap:wrap;}
  .tabela-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:16px;}
  .codigo-cell{font-family:'Archivo',sans-serif;font-weight:700;font-size:12.5px;color:var(--green);background:var(--offwhite);padding:3px 8px;border-radius:6px;display:inline-block;}
  .proprietario-tag{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}
</style>
</head>
<body>

<div id="tela-login">
  <h1>Entrar no painel</h1>
  <div class="erro" id="login-erro" style="display:none;"></div>
  <label>E-mail</label>
  <input id="login-email" type="email" autocomplete="username">
  <label>Senha</label>
  <input id="login-senha" type="password" autocomplete="current-password">
  <button class="btn btn-green" onclick="entrar()">Entrar</button>
</div>

<div id="app">
  <div class="wrap">
    <div class="topbar">
      <h1>Painel de imóveis</h1>
      <button class="btn btn-outline" onclick="sair()">Sair</button>
    </div>

    <div class="card-form">
      <h2 id="titulo-form">Adicionar novo imóvel</h2>
      <div class="msg" id="form-msg" style="display:none;"></div>
      <form id="form-imovel" onsubmit="return salvarImovel(event)">
        <input type="hidden" name="id" id="f-id">
        <div class="form-grid">
          <div><label>Título</label><input name="titulo" required placeholder="Terreno no Bairro X"></div>
          <div><label>Código</label><input name="codigo" placeholder="Gerado automaticamente"></div>
          <div>
            <label>Tipo</label>
            <select name="tipo">
              <option value="Terreno">Terreno</option>
              <option value="Casa">Casa</option>
              <option value="Apartamento">Apartamento</option>
            </select>
          </div>
        </div>
        <div class="form-grid">
          <div>
            <label>Finalidade</label>
            <select name="finalidade">
              <option value="Comprar">Comprar</option>
              <option value="Alugar">Alugar</option>
              <option value="Temporada">Temporada</option>
            </select>
          </div>
          <div><label>Cidade</label><input name="cidade" placeholder="Três Pontas"></div>
          <div><label>Bairro</label><input name="bairro" placeholder="Centro"></div>
        </div>
        <div class="form-grid">
          <div><label>Preço (R$)</label><input name="preco" type="number" step="0.01" placeholder="150000"></div>
          <div><label>Área (m²)</label><input name="area_m2" type="number" step="0.01" placeholder="360"></div>
          <div><label>Quartos</label><input name="quartos" type="number" placeholder="3"></div>
        </div>
        <div class="form-grid">
          <div><label>Banheiros</label><input name="banheiros" type="number" placeholder="2"></div>
          <div><label>Vagas</label><input name="vagas" type="number" placeholder="2"></div>
          <!-- CAMPO NOVO: Proprietário -->
          <div><label>Proprietário (Interno)</label><input name="proprietario" placeholder="Nome do proprietário"></div>
        </div>
        <div class="form-grid full">
          <div><label>Descrição</label><textarea name="descricao" placeholder="Detalhes do imóvel..."></textarea></div>
        </div>
        <div class="form-grid full">
          <div>
            <label>Fotos novas (pode selecionar várias — serão adicionadas às já existentes)</label>
            <input name="fotos" id="f-fotos" type="file" accept="image/*" multiple>
          </div>
        </div>
        <div class="check-row">
          <input type="checkbox" id="destaque_manual" name="destaque_manual">
          <label style="margin:0;" for="destaque_manual">Forçar destaque na home (independente de visualizações)</label>
        </div>
        <button class="btn btn-green" type="submit" id="btn-salvar">Salvar imóvel</button>
        <button class="btn btn-outline" type="button" id="btn-cancelar-edicao" style="display:none;" onclick="cancelarEdicao()">Cancelar edição</button>
      </form>
    </div>

    <!-- PAINEL DE FILTROS E PESQUISA -->
    <div class="tabela-topo">
      <h2 style="margin-bottom:0;">Imóveis cadastrados</h2>
      <button class="btn btn-outline btn-sm" onclick="exportarExcel()">📊 Exportar XLSX</button>
    </div>

    <div class="filtros-box">
      <div class="filtros-grid">
        <div>
          <label>Buscar (Código, Título ou Proprietário)</label>
          <input type="text" id="filtro-termo" placeholder="Digite para buscar...">
        </div>
        <div>
          <label>Tipo</label>
          <select id="filtro-tipo">
            <option value="">Todos os tipos</option>
            <option value="Casa">Casa</option>
            <option value="Terreno">Terreno</option>
            <option value="Apartamento">Apartamento</option>
          </select>
        </div>
        <div>
          <label>Status</label>
          <select id="filtro-status">
            <option value="">Todos</option>
            <option value="disp">Disponível</option>
            <option value="vend">Vendido/Inativo</option>
          </select>
        </div>
        <div>
          <label>Postado De</label>
          <input type="date" id="filtro-data-de">
        </div>
        <div>
          <label>Postado Até</label>
          <input type="date" id="filtro-data-ate">
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Foto</th><th>Código / Proprietário</th><th>Título</th><th>Tipo / Finalidade</th><th>Data Postagem</th><th>Local</th><th>Preço</th><th>Views</th><th>Status</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-imoveis"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script>
let editandoId = null;
let imoveisCache = [];
let imoveisFiltrados = [];

async function checarSessao() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById("tela-login").style.display = "none";
    document.getElementById("app").style.display = "block";
    carregarTabela();
  }
}

async function entrar() {
  const email = document.getElementById("login-email").value;
  const senha = document.getElementById("login-senha").value;
  const erroEl = document.getElementById("login-erro");
  erroEl.style.display = "none";

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) {
    erroEl.textContent = "E-mail ou senha inválidos.";
    erroEl.style.display = "block";
    return;
  }
  checarSessao();
}

async function sair() {
  await sb.auth.signOut();
  location.reload();
}

function mostrarMsg(texto, tipo) {
  const el = document.getElementById("form-msg");
  el.textContent = texto;
  el.className = "msg " + tipo;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

async function uploadFotos(arquivos) {
  const caminhos = [];
  for (const arquivo of arquivos) {
    const nome = `${Date.now()}-${Math.random().toString(36).slice(2)}-${arquivo.name}`;
    const { error } = await sb.storage.from("fotos-imoveis").upload(nome, arquivo);
    if (error) {
      console.error(error);
      continue;
    }
    caminhos.push(nome);
  }
  return caminhos;
}

async function salvarImovel(ev) {
  ev.preventDefault();
  const form = document.getElementById("form-imovel");
  const fd = new FormData(form);
  const btn = document.getElementById("btn-salvar");
  btn.disabled = true;
  btn.textContent = "Salvando...";

  try {
    const arquivos = document.getElementById("f-fotos").files;
    const novasFotos = arquivos.length ? await uploadFotos(arquivos) : [];

    const payload = {
      titulo: fd.get("titulo"),
      codigo: fd.get("codigo") || null,
      tipo: fd.get("tipo"),
      finalidade: fd.get("finalidade"),
      cidade: fd.get("cidade") || null,
      bairro: fd.get("bairro") || null,
      preco: fd.get("preco") ? Number(fd.get("preco")) : null,
      area_m2: fd.get("area_m2") ? Number(fd.get("area_m2")) : null,
      quartos: fd.get("quartos") ? Number(fd.get("quartos")) : null,
      banheiros: fd.get("banheiros") ? Number(fd.get("banheiros")) : null,
      vagas: fd.get("vagas") ? Number(fd.get("vagas")) : null,
      proprietario: fd.get("proprietario") || null, // Novo campo
      descricao: fd.get("descricao") || null,
      destaque_manual: document.getElementById("destaque_manual").checked,
    };

    if (editandoId) {
      const existente = imoveisCache.find(i => i.id === editandoId);
      payload.fotos = [...(existente?.fotos || []), ...novasFotos];
      const { error } = await sb.from("imoveis").update(payload).eq("id", editandoId);
      if (error) throw error;
      mostrarMsg("Imóvel atualizado com sucesso.", "ok");
    } else {
      payload.fotos = novasFotos;
      const { error } = await sb.from("imoveis").insert(payload);
      if (error) throw error;
      mostrarMsg("Imóvel cadastrado com sucesso.", "ok");
    }

    cancelarEdicao();
    carregarTabela();
  } catch (err) {
    console.error(err);
    mostrarMsg("Erro ao salvar: " + (err.message || err), "erro");
  } finally {
    btn.disabled = false;
    btn.textContent = "Salvar imóvel";
  }
  return false;
}

function editarImovel(id) {
  const im = imoveisCache.find(i => i.id === id);
  if (!im) return;
  editandoId = id;
  const form = document.getElementById("form-imovel");
  form.titulo.value = im.titulo || "";
  form.codigo.value = im.codigo || "";
  form.tipo.value = im.tipo || "Terreno";
  form.finalidade.value = im.finalidade || "Comprar";
  form.cidade.value = im.cidade || "";
  form.bairro.value = im.bairro || "";
  form.preco.value = im.preco ?? "";
  form.area_m2.value = im.area_m2 ?? "";
  form.quartos.value = im.quartos ?? "";
  form.banheiros.value = im.banheiros ?? "";
  form.vagas.value = im.vagas ?? "";
  form.proprietario.value = im.proprietario || "";
  form.descricao.value = im.descricao || "";
  document.getElementById("destaque_manual").checked = !!im.destaque_manual;
  document.getElementById("titulo-form").textContent = "Editando: " + im.titulo;
  document.getElementById("btn-cancelar-edicao").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelarEdicao() {
  editandoId = null;
  document.getElementById("form-imovel").reset();
  document.getElementById("titulo-form").textContent = "Adicionar novo imóvel";
  document.getElementById("btn-cancelar-edicao").style.display = "none";
}

async function alternarDisponibilidade(id, disponivelAtual) {
  const { error } = await sb.from("imoveis").update({ disponivel: !disponivelAtual }).eq("id", id);
  if (error) { alert("Erro: " + error.message); return; }
  carregarTabela();
}

async function excluirImovel(id) {
  if (!confirm("Excluir este imóvel permanentemente? Essa ação não pode ser desfeita.")) return;
  const im = imoveisCache.find(i => i.id === id);
  if (im && im.fotos && im.fotos.length) {
    await sb.storage.from("fotos-imoveis").remove(im.fotos);
  }
  const { error } = await sb.from("imoveis").delete().eq("id", id);
  if (error) { alert("Erro: " + error.message); return; }
  carregarTabela();
}

async function carregarTabela() {
  const { data, error } = await sb.from("imoveis").select("*").order("criado_em", { ascending: false });
  if (error) { console.error(error); return; }
  imoveisCache = data;
  aplicarFiltros();
}

function formatarData(isoStr) {
  if (!isoStr) return "—";
  const d = new Date(isoStr);
  return d.toLocaleDateString("pt-BR");
}

function aplicarFiltros() {
  const termo = document.getElementById("filtro-termo").value.trim().toLowerCase();
  const tipo = document.getElementById("filtro-tipo").value;
  const status = document.getElementById("filtro-status").value;
  const dataDe = document.getElementById("filtro-data-de").value;
  const dataAte = document.getElementById("filtro-data-ate").value;

  imoveisFiltrados = imoveisCache.filter(im => {
    // Busca textual (Código, Título ou Proprietário)
    const emCodigo = (im.codigo || "").toLowerCase().includes(termo);
    const emTitulo = (im.titulo || "").toLowerCase().includes(termo);
    const emProprietario = (im.proprietario || "").toLowerCase().includes(termo);
    if (termo && !emCodigo && !emTitulo && !emProprietario) return false;

    // Tipo
    if (tipo && im.tipo !== tipo) return false;

    // Status
    if (status === "disp" && !im.disponivel) return false;
    if (status === "vend" && im.disponivel) return false;

    // Data de postagem
    if (im.criado_em) {
      const dataCriacao = im.criado_em.substring(0, 10); // 'YYYY-MM-DD'
      if (dataDe && dataCriacao < dataDe) return false;
      if (dataAte && dataCriacao > dataAte) return false;
    }

    return true;
  });

  renderizarTabela(imoveisFiltrados);
}

function renderizarTabela(lista) {
  const tbody = document.getElementById("tabela-imoveis");

  tbody.innerHTML = lista.map(im => `
    <tr>
      <td><img class="thumb" src="${im.fotos && im.fotos[0] ? urlFoto(im.fotos[0]) : 'https://via.placeholder.com/56x42?text=—'}"></td>
      <td>
        <span class="codigo-cell">${im.codigo || "—"}</span>
        <span class="proprietario-tag">👤 ${im.proprietario || "Não informado"}</span>
      </td>
      <td>${im.titulo}</td>
      <td>${im.tipo || "—"} / ${im.finalidade || "—"}</td>
      <td>${formatarData(im.criado_em)}</td>
      <td>${[im.bairro, im.cidade].filter(Boolean).join(", ") || "—"}</td>
      <td>${fmtPreco(im.preco)}</td>
      <td>${im.visualizacoes || 0}</td>
      <td><span class="status ${im.disponivel ? "disp" : "vend"}">${im.disponivel ? "Disponível" : "Vendido/Inativo"}</span></td>
      <td class="acoes">
        <button class="btn btn-outline btn-sm" onclick="editarImovel('${im.id}')">Editar</button>
        <button class="btn btn-outline btn-sm" onclick="alternarDisponibilidade('${im.id}', ${im.disponivel})">
          ${im.disponivel ? "Marcar vendido" : "Reativar"}
        </button>
        <button class="btn btn-red btn-sm" onclick="excluirImovel('${im.id}')">Excluir</button>
      </td>
    </tr>
  `).join("") || '<tr><td colspan="10" style="color:#5C665F; padding:20px; text-align:center;">Nenhum imóvel encontrado com esses filtros.</td></tr>';
}

function exportarExcel() {
  if (!imoveisFiltrados.length) {
    alert("Nenhum imóvel para exportar.");
    return;
  }

  const dadosExportar = imoveisFiltrados.map(im => ({
    "Código": im.codigo || "—",
    "Título": im.titulo || "—",
    "Proprietário": im.proprietario || "—",
    "Tipo": im.tipo || "—",
    "Finalidade": im.finalidade || "—",
    "Preço (R$)": im.preco || 0,
    "Cidade": im.cidade || "—",
    "Bairro": im.bairro || "—",
    "Área (m²)": im.area_m2 || "—",
    "Quartos": im.quartos || 0,
    "Banheiros": im.banheiros || 0,
    "Vagas": im.vagas || 0,
    "Status": im.disponivel ? "Disponível" : "Vendido/Inativo",
    "Visualizações": im.visualizacoes || 0,
    "Data de Postagem": formatarData(im.criado_em)
  }));

  const worksheet = XLSX.utils.json_to_sheet(dadosExportar);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Imóveis Filtrados");
  
  XLSX.writeFile(workbook, `Relatorio_Imoveis_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

// Event Listeners para acionar a filtragem
["filtro-termo", "filtro-tipo", "filtro-status", "filtro-data-de", "filtro-data-ate"].forEach(id => {
  document.getElementById(id).addEventListener("input", aplicarFiltros);
  document.getElementById(id).addEventListener("change", aplicarFiltros);
});

checarSessao();
</script>
</body>
</html>
