<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Painel Admin — Paulino Imóveis</title>

<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

:root{
  --green:#0C3B2C;
  --green-dark:#082B20;
  --red:#C81E2C;
  --ink:#121815;
  --ink-soft:#5C665F;
  --line:#E3E7E2;
  --offwhite:#F6F7F5;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--offwhite);
}

button,
input,
select,
textarea{
  font:inherit;
}

.wrap{
  max-width:1400px;
  margin:0 auto;
  padding:32px 24px 80px;
}

h1,
h2{
  font-family:'Archivo',sans-serif;
}

h1{
  font-weight:800;
  font-size:24px;
  margin-bottom:24px;
}

h2{
  font-weight:700;
  font-size:18px;
  margin-bottom:14px;
}

/* ============================================================
   LOGIN
   ============================================================ */

#tela-login{
  max-width:340px;
  margin:100px auto;
  background:#fff;
  padding:32px;
  border-radius:12px;
  border:1px solid var(--line);
}

#tela-login h1{
  margin-bottom:20px;
}

#tela-login input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  margin-bottom:12px;
  font-size:14px;
}

#tela-login button{
  width:100%;
  padding:12px;
  background:var(--green);
  color:#fff;
  border:0;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

#tela-login button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.erro{
  color:var(--red);
  font-size:13px;
  margin-bottom:10px;
}

/* ============================================================
   APP
   ============================================================ */

#app{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
  gap:20px;
}

.topbar h1{
  margin-bottom:0;
}

/* ============================================================
   BOTÕES
   ============================================================ */

.btn{
  padding:10px 16px;
  border-radius:8px;
  border:0;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:.15s ease;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.btn-green{
  background:var(--green);
  color:#fff;
}

.btn-outline{
  background:#fff;
  border:1px solid var(--line);
  color:var(--ink);
}

.btn-red{
  background:var(--red);
  color:#fff;
}

.btn-sm{
  padding:7px 12px;
  font-size:12.5px;
}

/* ============================================================
   FORMULÁRIO
   ============================================================ */

.card-form{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:24px;
  margin-bottom:32px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:14px;
}

.form-grid.full{
  grid-template-columns:1fr;
}

label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  margin-bottom:5px;
}

input,
select,
textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:14px;
  font-family:inherit;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(12,59,44,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.check-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}

.check-row input{
  width:auto;
}

.msg{
  font-size:13px;
  margin-bottom:12px;
}

.msg.ok{
  color:var(--green);
}

.msg.erro{
  color:var(--red);
}

/* ============================================================
   DROPZONE
   ============================================================ */

.dropzone{
  border:2px dashed var(--line);
  border-radius:8px;
  padding:24px 16px;
  text-align:center;
  background:#fafbfa;
  cursor:pointer;
  transition:.2s ease;
}

.dropzone:hover,
.dropzone.dragover{
  border-color:var(--green);
  background:#eef4f0;
}

.dropzone-icon{
  font-size:28px;
  display:block;
  margin-bottom:6px;
}

.dropzone p{
  font-size:13.5px;
  color:var(--ink);
  margin-bottom:4px;
}

.dropzone-info{
  font-size:12px;
  color:var(--ink-soft);
  font-weight:500;
}

/* ============================================================
   FILTROS
   ============================================================ */

.filtros-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

.filtros-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1.2fr;
  gap:12px;
  align-items:end;
}

/* ============================================================
   TABELA
   ============================================================ */

.tabela-container{
  width:100%;
  overflow-x:auto;
  border-radius:12px;
}

table{
  width:100%;
  min-width:1200px;
  border-collapse:collapse;
  background:#fff;
  border:1px solid var(--line);
}

th,
td{
  padding:12px 14px;
  text-align:left;
  font-size:13.5px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}

th{
  background:#fafbfa;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--ink-soft);
  white-space:nowrap;
}

tr:last-child td{
  border-bottom:none;
}

.thumb{
  width:56px;
  height:42px;
  object-fit:cover;
  border-radius:6px;
  background:#eee;
  display:block;
}

.status{
  display:inline-block;
  padding:4px 10px;
  border-radius:100px;
  font-size:11.5px;
  font-weight:600;
  white-space:nowrap;
}

.status.disp{
  background:#E8EFEA;
  color:var(--green);
}

.status.vend{
  background:#FBE8E9;
  color:var(--red);
}

.acoes{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  min-width:190px;
}

.tabela-topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  gap:16px;
}

.codigo-cell{
  font-family:'Archivo',sans-serif;
  font-weight:700;
  font-size:12.5px;
  color:var(--green);
  background:var(--offwhite);
  padding:3px 8px;
  border-radius:6px;
  display:inline-block;
}

.proprietario-tag{
  display:block;
  font-size:11px;
  color:var(--ink-soft);
  margin-top:2px;
}

/* ============================================================
   RESPONSIVO
   ============================================================ */

@media(max-width:900px){

  .form-grid{
    grid-template-columns:1fr 1fr;
  }

  .filtros-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .wrap{
    padding:20px 14px 60px;
  }

  .topbar{
    align-items:flex-start;
  }

  .form-grid,
  .filtros-grid{
    grid-template-columns:1fr;
  }

  .card-form{
    padding:18px;
  }

}

</style>

</head>

<body>

<!-- ============================================================
     LOGIN
     ============================================================ -->

<div id="tela-login">

  <h1>Entrar no painel</h1>

  <div
    class="erro"
    id="login-erro"
    style="display:none;"
  ></div>

  <label for="login-email">
    E-mail
  </label>

  <input
    id="login-email"
    type="email"
    autocomplete="username"
  >

  <label for="login-senha">
    Senha
  </label>

  <input
    id="login-senha"
    type="password"
    autocomplete="current-password"
  >

  <button
    class="btn btn-green"
    id="btn-login"
    type="button"
  >
    Entrar
  </button>

</div>


<!-- ============================================================
     APLICAÇÃO
     ============================================================ -->

<div id="app">

<div class="wrap">

  <div class="topbar">

    <h1>
      Painel de imóveis
    </h1>

    <button
      class="btn btn-outline"
      id="btn-sair"
      type="button"
    >
      Sair
    </button>

  </div>


  <!-- ==========================================================
       FORMULÁRIO
       ========================================================== -->

  <div class="card-form">

    <h2 id="titulo-form">
      Adicionar novo imóvel
    </h2>

    <div
      class="msg"
      id="form-msg"
      style="display:none;"
    ></div>

    <form id="form-imovel">

      <input
        type="hidden"
        name="id"
        id="f-id"
      >

      <div class="form-grid">

        <div>
          <label>Título</label>

          <input
            name="titulo"
            required
            placeholder="Terreno no Bairro X"
          >
        </div>

        <div>

          <label>Código</label>

          <input
            name="codigo"
            placeholder="Gerado automaticamente"
          >

        </div>

        <div>

          <label>Tipo</label>

          <select name="tipo">

            <option value="Casa">Casa</option>
            <option value="Apartamento">Apartamento</option>
            <option value="Barracão">Barracão</option>
            <option value="Ponto Comercial">Ponto Comercial</option>
            <option value="Sítio/Fazenda">Sítio/Fazenda</option>
            <option value="Terreno">Terreno</option>
            <option value="Área de Lazer">Área de Lazer</option>

          </select>

        </div>

      </div>


      <div class="form-grid">

        <div>

          <label>Finalidade</label>

          <select name="finalidade">

            <option value="Comprar">Comprar</option>
            <option value="Alugar">Alugar</option>
            <option value="Temporada">Temporada</option>

          </select>

        </div>

        <div>

          <label>Cidade</label>

          <input
            name="cidade"
            id="f-cidade"
            list="lista-cidades"
            autocomplete="off"
            placeholder="Digite para buscar a cidade"
          >

          <datalist id="lista-cidades"></datalist>

        </div>

        <div>

          <label>Bairro</label>

          <input
            name="bairro"
            id="f-bairro"
            list="lista-bairros"
            autocomplete="off"
            placeholder="Digite para buscar o bairro"
          >

          <datalist id="lista-bairros"></datalist>

        </div>

      </div>


      <div class="form-grid">

        <div>

          <label>Preço (R$)</label>

          <input
            name="preco"
            id="f-preco"
            inputmode="numeric"
            autocomplete="off"
            placeholder="100.000,00"
          >

        </div>

        <div>

          <label>
            Área construída (m²)
          </label>

          <input
            name="area_construida_m2"
            type="number"
            step="0.01"
            min="0"
            placeholder="120"
          >

        </div>

        <div>

          <label>
            Área do terreno (m²)
          </label>

          <input
            name="area_terreno_m2"
            type="number"
            step="0.01"
            min="0"
            placeholder="360"
          >

        </div>

      </div>


      <div class="form-grid">

        <div>

          <label>Quartos</label>

          <input
            name="quartos"
            type="number"
            min="0"
            placeholder="3"
          >

        </div>

        <div>

          <label>Banheiros</label>

          <input
            name="banheiros"
            type="number"
            min="0"
            placeholder="2"
          >

        </div>

        <div>

          <label>Vagas</label>

          <input
            name="vagas"
            type="number"
            min="0"
            placeholder="2"
          >

        </div>

      </div>


      <div class="form-grid">

        <div>

          <label>
            Proprietário (Interno)
          </label>

          <input
            name="proprietario"
            placeholder="Nome do proprietário"
          >

        </div>

        <div>

          <label>
            Nº do proprietário (WhatsApp/telefone)
          </label>

          <input
            name="proprietario_telefone"
            type="tel"
            placeholder="(35) 99999-9999"
          >

        </div>

        <div>

          <label>
            Rua do imóvel
          </label>

          <input
            name="rua"
            placeholder="Rua, Avenida..."
          >

        </div>

      </div>


      <div class="form-grid full">

        <div>

          <label>
            Descrição
          </label>

          <textarea
            name="descricao"
            placeholder="Detalhes do imóvel..."
          ></textarea>

        </div>

      </div>


      <!-- ========================================================
           FOTOS
           ======================================================== -->

      <div class="form-grid full">

        <div>

          <label>
            Fotos novas
          </label>

          <div
            id="dropzone"
            class="dropzone"
          >

            <div class="dropzone-content">

              <span class="dropzone-icon">
                📁
              </span>

              <p>
                <strong>
                  Clique para selecionar
                </strong>
                ou arraste as fotos até aqui
              </p>

              <span
                id="fotos-qtd"
                class="dropzone-info"
              >
                Nenhuma foto selecionada
              </span>

            </div>

            <input
              name="fotos"
              id="f-fotos"
              type="file"
              accept="image/*"
              multiple
              style="display:none;"
            >

          </div>

        </div>

      </div>


      <div class="check-row">

        <input
          type="checkbox"
          id="destaque_manual"
          name="destaque_manual"
        >

        <label
          style="margin:0;"
          for="destaque_manual"
        >
          Forçar destaque na home
          (independente de visualizações)
        </label>

      </div>


      <button
        class="btn btn-green"
        type="submit"
        id="btn-salvar"
      >
        Salvar imóvel
      </button>

      <button
        class="btn btn-outline"
        type="button"
        id="btn-cancelar-edicao"
        style="display:none;"
      >
        Cancelar edição
      </button>

    </form>

  </div>


  <!-- ==========================================================
       LISTAGEM
       ========================================================== -->

  <div class="tabela-topo">

    <h2 style="margin-bottom:0;">
      Imóveis cadastrados
    </h2>

    <button
      class="btn btn-outline btn-sm"
      id="btn-exportar"
      type="button"
    >
      📊 Exportar XLSX
    </button>

  </div>


  <div class="filtros-box">

    <div class="filtros-grid">

      <div>

        <label>
          Buscar
          (Código, Título ou Proprietário)
        </label>

        <input
          type="text"
          id="filtro-termo"
          placeholder="Digite para buscar..."
        >

      </div>


      <div>

        <label>Tipo</label>

        <select id="filtro-tipo">

          <option value="">
            Todos os tipos
          </option>

          <option value="Casa">Casa</option>
          <option value="Apartamento">Apartamento</option>
          <option value="Barracão">Barracão</option>
          <option value="Ponto Comercial">Ponto Comercial</option>
          <option value="Sítio/Fazenda">Sítio/Fazenda</option>
          <option value="Terreno">Terreno</option>
          <option value="Área de Lazer">Área de Lazer</option>

        </select>

      </div>


      <div>

        <label>Status</label>

        <select id="filtro-status">

          <option value="">
            Todos
          </option>

          <option value="disp">
            Disponível
          </option>

          <option value="vend">
            Vendido/Inativo
          </option>

        </select>

      </div>


      <div>

        <label>
          Mês da postagem
        </label>

        <select id="filtro-mes-postagem">

          <option value="">
            Todos os meses
          </option>

        </select>

      </div>

    </div>

  </div>


  <div class="tabela-container">

    <table>

      <thead>

        <tr>

          <th>Foto</th>

          <th>
            Código / Proprietário
          </th>

          <th>Título</th>

          <th>
            Tipo / Finalidade
          </th>

          <th>
            Data Postagem
          </th>

          <th>Local</th>

          <th>Preço</th>

          <th>Views</th>

          <th>Status</th>

          <th>Ações</th>

        </tr>

      </thead>

      <tbody id="tabela-imoveis"></tbody>

    </table>

  </div>

</div>

</div>


<!-- ============================================================
     SCRIPTS
     ============================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="assets/config.js"></script>

<script src="assets/site.js"></script>


<script>

"use strict";

/* ==============================================================
   ESTADO
   ============================================================== */

let editandoId = null;

let imoveisCache = [];

let imoveisFiltrados = [];

let carregandoTabela = false;

let cidadesCarregadas = false;


/* ==============================================================
   ELEMENTOS
   ============================================================== */

const telaLogin =
  document.getElementById("tela-login");

const app =
  document.getElementById("app");

const form =
  document.getElementById("form-imovel");

const fileInput =
  document.getElementById("f-fotos");

const dropzone =
  document.getElementById("dropzone");

const fotosQtdText =
  document.getElementById("fotos-qtd");

const precoInput =
  document.getElementById("f-preco");


/* ==============================================================
   DROPZONE
   ============================================================== */

function atualizarTextoFotos() {

  const quantidade =
    fileInput.files
      ? fileInput.files.length
      : 0;

  if (!quantidade) {

    fotosQtdText.textContent =
      "Nenhuma foto selecionada";

    return;
  }

  fotosQtdText.textContent =
    quantidade === 1
      ? "1 foto selecionada"
      : `${quantidade} fotos selecionadas`;
}


fileInput.addEventListener(
  "change",
  atualizarTextoFotos
);


dropzone.addEventListener(
  "click",
  () => fileInput.click()
);


["dragenter", "dragover"].forEach(
  evento => {

    dropzone.addEventListener(
      evento,
      event => {

        event.preventDefault();
        event.stopPropagation();

        dropzone.classList.add(
          "dragover"
        );

      }
    );

  }
);


["dragleave", "drop"].forEach(
  evento => {

    dropzone.addEventListener(
      evento,
      event => {

        event.preventDefault();
        event.stopPropagation();

        dropzone.classList.remove(
          "dragover"
        );

      }
    );

  }
);


dropzone.addEventListener(
  "drop",
  event => {

    const arquivos =
      event.dataTransfer?.files;

    if (
      !arquivos ||
      !arquivos.length
    ) {
      return;
    }

    const imagens =
      [...arquivos].filter(
        arquivo =>
          arquivo.type.startsWith(
            "image/"
          )
      );

    if (!imagens.length) {

      alert(
        "Selecione apenas arquivos de imagem."
      );

      return;
    }

    try {

      const dataTransfer =
        new DataTransfer();

      imagens.forEach(
        arquivo =>
          dataTransfer.items.add(
            arquivo
          )
      );

      fileInput.files =
        dataTransfer.files;

      atualizarTextoFotos();

    } catch (erro) {

      console.error(
        "Erro ao adicionar arquivos:",
        erro
      );

    }

  }
);


/* ==============================================================
   PREÇO
   ============================================================== */

precoInput.addEventListener(
  "input",
  () => {

    const digitos =
      precoInput.value
        .replace(/\D/g, "");

    if (!digitos) {

      precoInput.value = "";

      return;
    }

    const numero =
      Number(digitos) / 100;

    precoInput.value =
      formatarPrecoBR(numero);

  }
);


/* ==============================================================
   LOGIN
   ============================================================== */

async function checarSessao() {

  try {

    const {
      data,
      error
    } = await sb.auth.getSession();

    if (error) {
      console.error(error);
      return;
    }

    if (data?.session) {

      mostrarAplicacao();

    } else {

      mostrarLogin();

    }

  } catch (erro) {

    console.error(
      "Erro ao verificar sessão:",
      erro
    );

    mostrarLogin();

  }

}


function mostrarLogin() {

  telaLogin.style.display =
    "block";

  app.style.display =
    "none";

}


function mostrarAplicacao() {

  telaLogin.style.display =
    "none";

  app.style.display =
    "block";

  carregarTabela();

  carregarSugestoesLocalidade();

}


async function entrar() {

  const email =
    document.getElementById(
      "login-email"
    ).value.trim();

  const senha =
    document.getElementById(
      "login-senha"
    ).value;

  const erroEl =
    document.getElementById(
      "login-erro"
    );

  const btn =
    document.getElementById(
      "btn-login"
    );

  erroEl.style.display =
    "none";

  if (!email || !senha) {

    erroEl.textContent =
      "Informe o e-mail e a senha.";

    erroEl.style.display =
      "block";

    return;
  }

  btn.disabled = true;
  btn.textContent = "Entrando...";

  try {

    const {
      error
    } = await sb.auth.signInWithPassword({
      email,
      password: senha
    });

    if (error) {

      console.error(error);

      erroEl.textContent =
        "E-mail ou senha inválidos.";

      erroEl.style.display =
        "block";

      return;
    }

    mostrarAplicacao();

  } catch (erro) {

    console.error(erro);

/* ==============================================================
   UPLOAD
   ============================================================== */

function gerarNomeArquivo(
  arquivo
) {

  const extensao =
    arquivo.name.includes(".")
      ? arquivo.name
          .split(".")
          .pop()
          .toLowerCase()
      : "jpg";

  const id =
    crypto.randomUUID
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random()
          .toString(36)
          .slice(2)}`;

  return `${id}.${extensao}`;

}


async function uploadFotos(arquivos, imovelId) {
  const caminhos = [];

  if (!arquivos || !arquivos.length) {
    return caminhos;
  }

  for (const arquivo of arquivos) {
    try {
      // Sanitiza o nome original
      const nomeOriginal = arquivo.name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9._-]/g, "_");

      // Cada imóvel possui sua própria "pasta"
      const nomeArquivo =
        `${Date.now()}-${Math.random().toString(36).slice(2)}-${nomeOriginal}`;

      const caminho = `${imovelId}/${nomeArquivo}`;

      const { error } = await sb.storage
        .from("fotos-imoveis")
        .upload(caminho, arquivo, {
          cacheControl: "3600",
          upsert: false
        });

      if (error) {
        console.error("Erro ao enviar foto:", error);
        throw error;
      }

      caminhos.push(caminho);

    } catch (error) {
      console.error("Falha no upload da foto:", arquivo.name, error);
      throw error;
    }
  }

  return caminhos;
}

   ============================================================== */

async function salvarImovel(ev) {
  ev.preventDefault();

  const form = document.getElementById("form-imovel");
  const fd = new FormData(form);

  const btn = document.getElementById("btn-salvar");

  btn.disabled = true;
  btn.textContent = editandoId
    ? "Atualizando..."
    : "Criando imóvel...";

  try {
    const arquivos = Array.from(fileInput.files || []);

    // ==========================================================
    // MONTA O DADOS DO IMÓVEL
    // ==========================================================

    const payload = {
      titulo: fd.get("titulo")?.trim() || "",
      codigo: fd.get("codigo")?.trim() || null,
      tipo: fd.get("tipo") || null,
      finalidade: fd.get("finalidade") || null,

      cidade: fd.get("cidade")?.trim() || null,
      bairro: fd.get("bairro")?.trim() || null,

      preco: parsePrecoBR(fd.get("preco")),

      area_construida_m2:
        fd.get("area_construida_m2")
          ? Number(fd.get("area_construida_m2"))
          : null,

      area_terreno_m2:
        fd.get("area_terreno_m2")
          ? Number(fd.get("area_terreno_m2"))
          : null,

      quartos:
        fd.get("quartos")
          ? Number(fd.get("quartos"))
          : null,

      banheiros:
        fd.get("banheiros")
          ? Number(fd.get("banheiros"))
          : null,

      vagas:
        fd.get("vagas")
          ? Number(fd.get("vagas"))
          : null,

      proprietario:
        fd.get("proprietario")?.trim() || null,

      proprietario_telefone:
        fd.get("proprietario_telefone")?.trim() || null,

      rua:
        fd.get("rua")?.trim() || null,

      descricao:
        fd.get("descricao")?.trim() || null,

      destaque_manual:
        document.getElementById("destaque_manual").checked
    };


    // ==========================================================
    // EDITANDO IMÓVEL EXISTENTE
    // ==========================================================

    if (editandoId) {

      const existente = imoveisCache.find(
        i => String(i.id) === String(editandoId)
      );

      if (!existente) {
        throw new Error("Imóvel não encontrado no cache.");
      }

      // Mantém as fotos antigas
      let fotosExistentes = Array.isArray(existente.fotos)
        ? [...existente.fotos]
        : [];

      // Primeiro atualiza os dados
      const { error: updateError } = await sb
        .from("imoveis")
        .update(payload)
        .eq("id", editandoId);

      if (updateError) {
        throw updateError;
      }

      // Faz upload das novas fotos dentro da pasta do imóvel
      if (arquivos.length > 0) {

        btn.textContent = "Enviando fotos...";

        const novasFotos = await uploadFotos(
          arquivos,
          editandoId
        );

        fotosExistentes = [
          ...fotosExistentes,
          ...novasFotos
        ];

        const { error: fotosError } = await sb
          .from("imoveis")
          .update({
            fotos: fotosExistentes
          })
          .eq("id", editandoId);

        if (fotosError) {
          throw fotosError;
        }
      }

      mostrarMsg(
        "Imóvel atualizado com sucesso.",
        "ok"
      );

    }

    // ==========================================================
    // CRIANDO NOVO IMÓVEL
    // ==========================================================

    else {

      // Primeiro cria o imóvel.
      // O Supabase gera o ID.
      btn.textContent = "Criando imóvel...";

      const { data: novoImovel, error: insertError } = await sb
        .from("imoveis")
        .insert({
          ...payload,
          fotos: []
        })
        .select()
        .single();

      if (insertError) {
        throw insertError;
      }

      if (!novoImovel || !novoImovel.id) {
        throw new Error(
          "O imóvel foi criado, mas não foi possível obter o ID."
        );
      }

      const novoId = novoImovel.id;

      // ========================================================
      // AGORA TEMOS O ID
      // E PODEMOS CRIAR A "PASTA"
      // ========================================================

      if (arquivos.length > 0) {

        btn.textContent = "Enviando fotos...";

        const novasFotos = await uploadFotos(
          arquivos,
          novoId
        );

        // Salva os caminhos das fotos no registro
        const { error: fotosError } = await sb
          .from("imoveis")
          .update({
            fotos: novasFotos
          })
          .eq("id", novoId);

        if (fotosError) {
          throw fotosError;
        }
      }

      mostrarMsg(
        "Imóvel cadastrado com sucesso.",
        "ok"
      );
    }

    // ==========================================================
    // FINALIZA
    // ==========================================================

    cancelarEdicao();

    await carregarTabela();

  } catch (err) {

    console.error("Erro ao salvar imóvel:", err);

    mostrarMsg(
      "Erro ao salvar: " + (err.message || err),
      "erro"
    );

  } finally {

    btn.disabled = false;
    btn.textContent = "Salvar imóvel";
  }

  return false;
}

/* ==============================================================
   EXCLUIR
   ============================================================== */

async function excluirImovel(
  id
) {

  const im =
    imoveisCache.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!im) {
    alert(
      "Imóvel não encontrado."
    );
    return;
  }

  const confirmado =
    confirm(
      "Excluir este imóvel permanentemente?\n\n" +
      "Essa ação não pode ser desfeita."
    );

  if (!confirmado) {
    return;
  }

  try {

    /* ----------------------------------------------------------
       PRIMEIRO REMOVE O REGISTRO DO BANCO
       ---------------------------------------------------------- */

    const {
      error
    } = await sb
      .from("imoveis")
      .delete()
      .eq(
        "id",
        id
      );

    if (error) {
      throw error;
    }

    /* ----------------------------------------------------------
       DEPOIS REMOVE AS FOTOS
       ---------------------------------------------------------- */

    if (
      Array.isArray(im.fotos) &&
      im.fotos.length
    ) {

      const fotosStorage =
        im.fotos.filter(
          foto =>
            foto &&
            !String(
              foto
            ).startsWith(
              "http://"
            ) &&
            !String(
              foto
            ).startsWith(
              "https://"
            )
        );

      if (fotosStorage.length) {

        const {
          error:
            storageError
        } = await sb.storage
          .from(
            "fotos-imoveis"
          )
          .remove(
            fotosStorage
          );

        if (storageError) {

          console.warn(
            "Registro excluído, mas houve erro ao remover fotos:",
            storageError
          );

        }

      }

    }

    if (
      String(editandoId) ===
      String(id)
    ) {
      cancelarEdicao();
    }

    await carregarTabela();

    mostrarMsg(
      "Imóvel excluído com sucesso.",
      "ok"
    );

  } catch (erro) {

    console.error(
      "Erro ao excluir:",
      erro
    );

    alert(
      "Erro ao excluir:\n" +
      (
        erro?.message ||
        "Erro desconhecido"
      )
    );

  }

}

async function carregarTabela() {

  if (carregandoTabela) {
    return;
  }

  carregandoTabela =
    true;

  try {

    const {
      data,
      error
    } = await sb
      .from("imoveis")
      .select("*")
      .order(
        "criado_em",
        {
          ascending:false
        }
      );

    if (error) {
      throw error;
    }

    imoveisCache =
      Array.isArray(data)
        ? data
        : [];

    preencherFiltroMeses();

    aplicarFiltros();

  } catch (erro) {

    console.error(
      "Erro ao carregar imóveis:",
      erro
    );

    document.getElementById(
      "tabela-imoveis"
    ).innerHTML = `
      <tr>
        <td
          colspan="10"
          style="
            color:#C81E2C;
            padding:20px;
            text-align:center;

          Erro ao carregar os imóveis.
          <br>
          ${escapeHtml(
            erro?.message ||
            ""
          )}
        </td>
      </tr>
    `;

  } finally {

    carregandoTabela =
      false;

  }

}


/* ==============================================================
   DATA
   ============================================================== */

function formatarData(
  isoStr
) {

  if (!isoStr) {
    return "—";
  }

  const data =
    new Date(
      isoStr
    );

  if (
    Number.isNaN(
      data.getTime()
    )
  ) {
    return "—";
  }

  return data.toLocaleDateString(
    "pt-BR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* ==============================================================
   FILTROS
   ============================================================== */

function aplicarFiltros() {

  const termo =
    document.getElementById(
      "filtro-termo"
    )
    .value
    .trim()
    .toLowerCase();

  const tipo =
    document.getElementById(
      "filtro-tipo"
    ).value;

  const status =
    document.getElementById(
      "filtro-status"
    ).value;

  const mes =
    document.getElementById(
      "filtro-mes-postagem"
    ).value;


  imoveisFiltrados =
    imoveisCache.filter(
      im => {

        if (termo) {

          const campos = [

            im.codigo,

            im.titulo,

            im.proprietario,

            im.cidade,

            im.bairro,

            im.rua

          ]
            .filter(Boolean)
            .map(
              valor =>
                String(valor)
                  .toLowerCase()
            );

          const encontrou =
            campos.some(
              campo =>
                campo.includes(
                  termo
                )
            );

          if (!encontrou) {
            return false;
          }

        }


        if (
          tipo &&
          im.tipo !== tipo
        ) {
          return false;
        }


        if (
          status === "disp" &&
          !im.disponivel
        ) {
          return false;
        }


        if (
          status === "vend" &&
          im.disponivel
        ) {
          return false;
        }


        if (mes) {

          if (!im.criado_em) {
            return false;
          }

          const chave =
            String(
              im.criado_em
            ).slice(0,7);

          if (
            chave !== mes
          ) {
            return false;
          }

        }

        return true;

      }
    );

  renderizarTabela(
    imoveisFiltrados
  );

}

async function carregarSugestoesLocalidade() {

        "https://servicodados.ibge.gov.br/api/v1/localidades/municipios"
      );

    if (!response.ok) {
      throw new Error(
        "IBGE retornou erro."
      );
    }

    const municipios =
      await response.json();

    municipios.sort(
      (a,b) =>
        a.nome.localeCompare(
          b.nome,
          "pt-BR"
        )
    );

    listaCidades.innerHTML =
      municipios
        .map(
          municipio =>
            `<option value="${escapeHtml(
              municipio.nome
            )}"></option>`
        )
        .join("");

  } catch (erro) {

    console.warn(
      "Não foi possível carregar cidades do IBGE:",
      erro
    );

  }


  cidade.addEventListener(
    "input",
    carregarBairros
  );

  cidade.addEventListener(
    "change",
    carregarBairros
  );

  await carregarBairros();

}


async function carregarBairros() {

  const cidade =
    document.getElementById(
      "f-cidade"
    );

  const bairro =
    document.getElementById(
      "f-bairro"
    );

  const listaBairros =
    document.getElementById(
      "lista-bairros"
    );


  const cidadeNormalizada =
    normalizarLocal(
      cidade.value
    );


  try {

    let query =
      sb
        .from("imoveis")
        .select(
          "cidade,bairro"
        )
        .not(
          "bairro",
          "is",
          null
        );


    if (cidadeNormalizada) {

      /*
       * Buscamos os imóveis e fazemos
       * a comparação sem acento no JS,
       * pois ilike não resolve todos os
       * casos de acentuação.
       */

    }


    const {
      data,
      error
    } = await query;


    if (error) {
      throw error;
    }


    const bairros =
      [
        ...new Set(
          (data || [])
            .filter(
              item => {

                if (
                  !cidadeNormalizada
                ) {
                  return true;
                }

                return (
                  normalizarLocal(
                    item.cidade
                  ) ===
                  cidadeNormalizada
                );

              }
            )
            .map(
              item =>
                item.bairro
            )
            .filter(Boolean)
        )
      ].sort(
        (a,b) =>
          a.localeCompare(
            b,
            "pt-BR"
          )
      );


    listaBairros.innerHTML =
      bairros
        .map(
          item =>
            `<option value="${escapeHtml(
              item
            )}"></option>`
        )
        .join("");


  } catch (erro) {

    console.warn(
      "Erro ao carregar bairros:",
      erro
    );

    listaBairros.innerHTML =
      "";

  }

}


/* ==============================================================
   FILTRO DE MESES
   ============================================================== */

function preencherFiltroMeses() {

  const select =
    document.getElementById(
      "filtro-mes-postagem"
    );

  const meses =
    [
      ...new Set(
        imoveisCache
          .filter(
            im =>
              im.criado_em
          )
          .map(
            im =>
              String(
                im.criado_em
              ).slice(0,7)
          )
      )
    ]
    .sort()
    .reverse();


  const formatter =
    new Intl.DateTimeFormat(
      "pt-BR",
      {
        month:"long"
      }
    );


  select.innerHTML =
    `
      <option value="">
        Todos os meses
      </option>
    ` +
    meses
      .map(
        chave => {

          const [
            ano,
            mes
          ] =
            chave.split("-");

          const data =
            new Date(
              Number(ano),
              Number(mes) - 1,
              1
            );

          const nome =
            formatter.format(
              data
            );

          const nomeFormatado =
            nome.charAt(0)
              .toUpperCase() +
            nome.slice(1);


          return `
            <option value="${chave}">
              ${nomeFormatado}, ${ano}
            </option>
          `;

        }
      )
      .join("");

}
