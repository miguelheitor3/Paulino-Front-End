<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Admin — Paulino Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --green:#0C3B2C; --green-dark:#082B20; --red:#C81E2C;
    --ink:#121815; --ink-soft:#5C665F; --line:#E3E7E2; --offwhite:#F6F7F5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--offwhite);}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px;}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;margin-bottom:24px;}
  h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;margin-bottom:14px;}

  #tela-login{max-width:340px;margin:100px auto;background:#fff;padding:32px;border-radius:12px;border:1px solid var(--line);}
  #tela-login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;}
  #tela-login button{width:100%;padding:12px;background:var(--green);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;}

  #app{display:none;}
  .topbar{display:flex;justify-style:space-between;align-items:center;margin-bottom:28px;}
  .btn{padding:10px 16px;border-radius:8px;border:0;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}

  .card-form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:32px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
  .form-grid.full{grid-template-columns:1fr;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  
  .dropzone {border: 2px dashed var(--line);border-radius: 8px;padding: 24px 16px;text-align: center;background: #fafbfa;cursor: pointer;}
  .filtros-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .filtros-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;align-items:end;}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th,td{padding:12px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{background:#fafbfa;font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);}
  .thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;}
  .status{display:inline-block;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:600;}
  .status.disp{background:#E8EFEA;color:var(--green);}
  .status.vend{background:#FBE8E9;color:var(--red);}
</style>
</head>
<body>

<div id="tela-login">
  <h1>Entrar no painel</h1>
  <div id="login-erro" style="display:none;color:var(--red);margin-bottom:10px;font-size:13px;"></div>
  <label>E-mail</label><input id="login-email" type="email">
  <label>Senha</label><input id="login-senha" type="password">
  <button onclick="entrar()">Entrar</button>
</div>

<div id="app">
  <div class="wrap">
    <div class="topbar">
      <h1>Painel de imóveis</h1>
      <button class="btn btn-outline" onclick="sair()">Sair</button>
    </div>

    <div class="card-form">
      <h2 id="titulo-form">Adicionar novo imóvel</h2>
      <div id="form-msg" style="display:none;padding:10px;margin-bottom:10px;border-radius:6px;"></div>
      <form id="form-imovel" onsubmit="return salvarImovel(event)">
        <input type="hidden" name="id" id="f-id">
        
        <div class="form-grid">
          <div><label>Título</label><input name="titulo" required placeholder="Casa no Centro"></div>
          <div><label>Código</label><input name="codigo" placeholder="Autogerado"></div>
          <div>
            <label>Tipo de Imóvel</label>
            <select name="tipo" id="f-tipo">
              <option value="Casa">Casa</option>
              <option value="Apartamento">Apartamento</option>
              <option value="Barracão">Barracão</option>
              <option value="Ponto Comercial">Ponto Comercial</option>
              <option value="Sítio/Fazenda">Sítio/Fazenda</option>
              <option value="Terreno">Terreno</option>
              <option value="Área de Lazer">Área de Lazer</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label>Finalidade</label>
            <select name="finalidade">
              <option value="Comprar">Comprar</option>
              <option value="Alugar">Alugar</option>
              <option value="Temporada">Temporada</option>
            </select>
          </div>
          <div>
            <label>Cidade</label>
            <input name="cidade" id="f-cidade" list="dl-admin-cidades" placeholder="Três Pontas">
            <datalist id="dl-admin-cidades"></datalist>
          </div>
          <div>
            <label>Bairro</label>
            <input name="bairro" id="f-bairro" list="dl-admin-bairros" placeholder="Centro">
            <datalist id="dl-admin-bairros"></datalist>
          </div>
        </div>

        <div class="form-grid">
          <div><label>Rua / Endereço</label><input name="rua" placeholder="Rua Bento de Brito, 170"></div>
          <div><label>Preço (R$)</label><input name="preco" id="f-preco" placeholder="R$ 100.000,00"></div>
          <div><label>Nº do Proprietário (Tel/WhatsApp)</label><input name="numero_proprietario" placeholder="(35) 99999-9999"></div>
        </div>

        <div class="form-grid">
          <div><label>Área Construída (m²)</label><input name="area_construida_m2" type="number" step="0.01" placeholder="120"></div>
          <div><label>Área do Terreno (m²)</label><input name="area_terreno_m2" type="number" step="0.01" placeholder="250"></div>
          <div><label>Nome do Proprietário</label><input name="proprietario" placeholder="João da Silva"></div>
        </div>

        <div class="form-grid">
          <div><label>Quartos</label><input name="quartos" type="number" placeholder="3"></div>
          <div><label>Banheiros</label><input name="banheiros" type="number" placeholder="2"></div>
          <div><label>Vagas de Garagem</label><input name="vagas" type="number" placeholder="2"></div>
        </div>

        <div class="form-grid full">
          <div><label>Descrição</label><textarea name="descricao" placeholder="Detalhes completos do imóvel..."></textarea></div>
        </div>
        
        <div class="form-grid full">
          <div>
            <label>Fotos</label>
            <div id="dropzone" class="dropzone" onclick="document.getElementById('f-fotos').click()">
              <p>📸 <strong>Clique ou arraste fotos aqui</strong></p>
              <span id="fotos-qtd" style="font-size:12px;color:var(--ink-soft);">Nenhuma foto selecionada</span>
              <input name="fotos" id="f-fotos" type="file" accept="image/*" multiple style="display:none;">
            </div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
          <input type="checkbox" id="destaque_manual" name="destaque_manual">
          <label for="destaque_manual" style="margin:0;">Forçar Destaque na Home</label>
        </div>

        <button class="btn btn-green" type="submit" id="btn-salvar">Salvar imóvel</button>
        <button class="btn btn-outline" type="button" id="btn-cancelar" style="display:none;" onclick="cancelarEdicao()">Cancelar edição</button>
      </form>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h2>Imóveis cadastrados</h2>
      <button class="btn btn-outline btn-sm" onclick="exportarExcel()">📊 Exportar XLSX</button>
    </div>

    <!-- PAINEL DE FILTROS COM FILTRO ÚNICO DE MÊS/ANO -->
    <div class="filtros-box">
      <div class="filtros-grid">
        <div>
          <label>Buscar (Código, Título, Proprietário ou Rua)</label>
          <input type="text" id="filtro-termo" placeholder="Digite para buscar...">
        </div>
        <div>
          <label>Tipo</label>
          <select id="filtro-tipo">
            <option value="">Todos os tipos</option>
            <option value="Casa">Casa</option>
            <option value="Apartamento">Apartamento</option>
            <option value="Barracão">Barracão</option>
            <option value="Ponto Comercial">Ponto Comercial</option>
            <option value="Sítio/Fazenda">Sítio/Fazenda</option>
            <option value="Terreno">Terreno</option>
            <option value="Área de Lazer">Área de Lazer</option>
          </select>
        </div>
        <div>
          <label>Status</label>
          <select id="filtro-status">
            <option value="">Todos</option>
            <option value="disp">Disponível</option>
            <option value="vend">Vendido/Inativo</option>
          </select>
        </div>
        <div>
          <label>Mês / Ano da Postagem</label>
          <input type="month" id="filtro-mes-ano">
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Foto</th><th>Código / Prop.</th><th>Título / Rua</th><th>Tipo / Fin.</th><th>Área (Const/Terr)</th><th>Postado Em</th><th>Preço</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-imoveis"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script>
let editandoId = null;
let imoveisCache = [];
const fileInput = document.getElementById("f-fotos");

// MÁSCARA AUTOMÁTICA DE MOEDA NO CAMPO PREÇO
aplicarMascaraMoeda(document.getElementById("f-preco"));

fileInput.addEventListener("change", () => {
  const count = fileInput.files ? fileInput.files.length : 0;
  document.getElementById("fotos-qtd").textContent = count === 0 ? "Nenhuma foto selecionada" : `${count} foto(s) selecionada(s)`;
});

async function checarSessao() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById("tela-login").style.display = "none";
    document.getElementById("app").style.display = "block";
    carregarTabela();
    carregarDatalistsAdmin();
  }
}

async function carregarDatalistsAdmin() {
  const { data } = await sb.from("imoveis").select("cidade, bairro");
  if (!data) return;
  const cidades = [...new Set(data.map(d => d.cidade).filter(Boolean))];
  const bairros = [...new Set(data.map(d => d.bairro).filter(Boolean))];
  document.getElementById("dl-admin-cidades").innerHTML = cidades.map(c => `<option value="${c}">`).join("");
  document.getElementById("dl-admin-bairros").innerHTML = bairros.map(b => `<option value="${b}">`).join("");
}

async function entrar() {
  const email = document.getElementById("login-email").value;
  const senha = document.getElementById("login-senha").value;
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) {
    document.getElementById("login-erro").textContent = "Login inválido.";
    document.getElementById("login-erro").style.display = "block";
    return;
  }
  checarSessao();
}

async function sair() { await sb.auth.signOut(); location.reload(); }

async function salvarImovel(ev) {
  ev.preventDefault();
  const form = document.getElementById("form-imovel");
  const fd = new FormData(form);
  const btn = document.getElementById("btn-salvar");
  btn.disabled = true;

  try {
    const novasFotos = fileInput.files.length ? await uploadFotos(fileInput.files) : [];
    const payload = {
      titulo: fd.get("titulo"),
      codigo: fd.get("codigo") || null,
      tipo: fd.get("tipo"),
      finalidade: fd.get("finalidade"),
      cidade: fd.get("cidade") || null,
      bairro: fd.get("bairro") || null,
      rua: fd.get("rua") || null,
      numero_proprietario: fd.get("numero_proprietario") || null,
      preco: parseMoedaParaNumero(fd.get("preco")),
      area_construida_m2: fd.get("area_construida_m2") ? Number(fd.get("area_construida_m2")) : null,
      area_terreno_m2: fd.get("area_terreno_m2") ? Number(fd.get("area_terreno_m2")) : null,
      quartos: fd.get("quartos") ? Number(fd.get("quartos")) : null,
      banheiros: fd.get("banheiros") ? Number(fd.get("banheiros")) : null,
      vagas: fd.get("vagas") ? Number(fd.get("vagas")) : null,
      proprietario: fd.get("proprietario") || null,
      descricao: fd.get("descricao") || null,
      destaque_manual: document.getElementById("destaque_manual").checked,
    };

    if (editandoId) {
      const ex = imoveisCache.find(i => i.id === editandoId);
      payload.fotos = [...(ex?.fotos || []), ...novasFotos];
      await sb.from("imoveis").update(payload).eq("id", editandoId);
    } else {
      payload.fotos = novasFotos;
      await sb.from("imoveis").insert(payload);
    }

    cancelarEdicao();
    carregarTabela();
  } catch (err) {
    alert("Erro ao salvar: " + err.message);
  } finally {
    btn.disabled = false;
  }
  return false;
}

async function uploadFotos(arquivos) {
  const caminhos = [];
  for (const arq of arquivos) {
    const nome = `${Date.now()}-${Math.random().toString(36).slice(2)}-${arq.name}`;
    const { error } = await sb.storage.from("fotos-imoveis").upload(nome, arq);
    if (!error) caminhos.push(nome);
  }
  return caminhos;
}

async function carregarTabela() {
  const { data } = await sb.from("imoveis").select("*").order("criado_em", { ascending: false });
  imoveisCache = data || [];
  aplicarFiltros();
}

function aplicarFiltros() {
  const termo = document.getElementById("filtro-termo").value.trim().toLowerCase();
  const tipo = document.getElementById("filtro-tipo").value;
  const status = document.getElementById("filtro-status").value;
  const mesAno = document.getElementById("filtro-mes-ano").value; // Formato YYYY-MM

  const filtrados = imoveisCache.filter(im => {
    const buscaStr = `${im.codigo || ''} ${im.titulo || ''} ${im.proprietario || ''} ${im.rua || ''}`.toLowerCase();
    if (termo && !buscaStr.includes(termo)) return false;
    if (tipo && im.tipo !== tipo) return false;
    if (status === "disp" && !im.disponivel) return false;
    if (status === "vend" && im.disponivel) return false;
    if (mesAno && im.criado_em && !im.criado_em.startsWith(mesAno)) return false;
    return true;
  });

  renderizarTabela(filtrados);
}

function renderizarTabela(lista) {
  const tbody = document.getElementById("tabela-imoveis");
  tbody.innerHTML = lista.map(im => `
    <tr>
      <td><img class="thumb" src="${im.fotos && im.fotos[0] ? urlFoto(im.fotos[0]) : 'https://via.placeholder.com/56'}"></td>
      <td>
        <strong>${im.codigo || 'S/N'}</strong><br>
        <span style="font-size:11px;color:var(--ink-soft);">👤 ${im.proprietario || 'N/I'} (${im.numero_proprietario || 'S/ Tel'})</span>
      </td>
      <td>
        <strong>${im.titulo}</strong><br>
        <span style="font-size:11px;color:var(--ink-soft);">${im.rua || ''} ${im.bairro || ''}</span>
      </td>
      <td>${im.tipo || '—'} / ${im.finalidade}</td>
      <td>C: ${im.area_construida_m2 || '—'} m²<br>T: ${im.area_terreno_m2 || '—'} m²</td>
      <td>${new Date(im.criado_em).toLocaleDateString('pt-BR')}</td>
      <td>${fmtPreco(im.preco)}</td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="editarImovel('${im.id}')">Editar</button>
      </td>
    </tr>
  `).join("");
}

function editarImovel(id) {
  const im = imoveisCache.find(i => i.id === id);
  if (!im) return;
  editandoId = id;
  const form = document.getElementById("form-imovel");
  form.titulo.value = im.titulo || "";
  form.codigo.value = im.codigo || "";
  form.tipo.value = im.tipo || "Casa";
  form.finalidade.value = im.finalidade || "Comprar";
  form.cidade.value = im.cidade || "";
  form.bairro.value = im.bairro || "";
  form.rua.value = im.rua || "";
  form.numero_proprietario.value = im.numero_proprietario || "";
  form.preco.value = im.preco ? "R$ " + Number(im.preco).toLocaleString("pt-BR", {minimumFractionDigits: 2}) : "";
  form.area_construida_m2.value = im.area_construida_m2 || "";
  form.area_terreno_m2.value = im.area_terreno_m2 || "";
  form.proprietario.value = im.proprietario || "";
  form.descricao.value = im.descricao || "";
  document.getElementById("destaque_manual").checked = !!im.destaque_manual;
  document.getElementById("btn-cancelar").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelarEdicao() {
  editandoId = null;
  document.getElementById("form-imovel").reset();
  document.getElementById("btn-cancelar").style.display = "none";
}

["filtro-termo", "filtro-tipo", "filtro-status", "filtro-mes-ano"].forEach(id => {
  document.getElementById(id).addEventListener("input", aplicarFiltros);
});

checarSessao();
</script>
</body>
</html>
