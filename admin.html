<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Admin — Paulino Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0C3B2C; --green-dark:#082B20; --red:#C81E2C;
    --ink:#121815; --ink-soft:#5C665F; --line:#E3E7E2; --offwhite:#F6F7F5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--offwhite);}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px;}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;margin-bottom:24px;}
  h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;margin-bottom:14px;}

  /* login */
  #tela-login{max-width:340px;margin:100px auto;background:#fff;padding:32px;border-radius:12px;border:1px solid var(--line);}
  #tela-login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:14px;}
  #tela-login button{width:100%;padding:12px;background:var(--green);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;}
  .erro{color:var(--red);font-size:13px;margin-bottom:10px;}

  /* layout geral */
  #app{display:none;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  .btn{padding:10px 16px;border-radius:8px;border:0;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}

  /* formulario novo terreno */
  .card-form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:32px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .form-grid.full{grid-template-columns:1fr;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{min-height:80px;resize:vertical;}
  .check-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}

  /* tabela */
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th,td{padding:12px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{background:#fafbfa;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  tr:last-child td{border-bottom:none;}
  .thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;background:#eee;}
  .status{display:inline-block;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:600;}
  .status.disp{background:#E8EFEA;color:var(--green);}
  .status.vend{background:#FBE8E9;color:var(--red);}
  .acoes{display:flex;gap:6px;}
</style>
</head>
<body>

<div id="tela-login">
  <h1>Entrar no painel</h1>
  <div class="erro" id="login-erro" style="display:none;"></div>
  <label>Usuário</label>
  <input id="login-usuario" autocomplete="username">
  <label>Senha</label>
  <input id="login-senha" type="password" autocomplete="current-password">
  <button class="btn btn-green" onclick="entrar()">Entrar</button>
</div>

<div id="app">
  <div class="wrap">
    <div class="topbar">
      <h1>Painel de terrenos</h1>
      <button class="btn btn-outline" onclick="sair()">Sair</button>
    </div>

    <div class="card-form">
      <h2>Adicionar novo terreno</h2>
      <form id="form-novo" onsubmit="return criarTerreno(event)">
        <div class="form-grid">
          <div><label>Título</label><input name="titulo" required placeholder="Terreno no Bairro X"></div>
          <div><label>Código</label><input name="codigo" placeholder="0023"></div>
        </div>
        <div class="form-grid">
          <div><label>Cidade</label><input name="cidade" placeholder="Três Pontas"></div>
          <div><label>Bairro</label><input name="bairro" placeholder="Centro"></div>
        </div>
        <div class="form-grid">
          <div><label>Preço (R$)</label><input name="preco" type="number" step="0.01" placeholder="150000"></div>
          <div><label>Área (m²)</label><input name="area_m2" type="number" step="0.01" placeholder="360"></div>
        </div>
        <div class="form-grid full">
          <div><label>Descrição</label><textarea name="descricao" placeholder="Detalhes do terreno..."></textarea></div>
        </div>
        <div class="form-grid full">
          <div><label>Fotos (pode selecionar várias)</label><input name="fotos" type="file" accept="image/*" multiple></div>
        </div>
        <div class="check-row">
          <input type="checkbox" id="destaque_manual" name="destaque_manual">
          <label style="margin:0;" for="destaque_manual">Forçar destaque na home (independente de visualizações)</label>
        </div>
        <button class="btn btn-green" type="submit">Salvar terreno</button>
      </form>
    </div>

    <h2>Terrenos cadastrados</h2>
    <table>
      <thead>
        <tr>
          <th>Foto</th><th>Título</th><th>Local</th><th>Preço</th><th>Views</th><th>Status</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-terrenos"></tbody>
    </table>
  </div>
</div>

<script>
const fmtPreco = (v) => v == null ? '—' :
  v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

async function checarSessao() {
  const r = await fetch('/api/admin/me');
  const { autenticado } = await r.json();
  if (autenticado) {
    document.getElementById('tela-login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    carregarTabela();
  }
}

async function entrar() {
  const usuario = document.getElementById('login-usuario').value;
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  erroEl.style.display = 'none';

  const r = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario, senha }),
  });
  if (r.ok) {
    checarSessao();
  } else {
    erroEl.textContent = 'Usuário ou senha inválidos.';
    erroEl.style.display = 'block';
  }
}

async function sair() {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.reload();
}

async function criarTerreno(ev) {
  ev.preventDefault();
  const form = document.getElementById('form-novo');
  const fd = new FormData(form);
  fd.set('destaque_manual', document.getElementById('destaque_manual').checked ? 'true' : 'false');

  const r = await fetch('/api/admin/terrenos', { method: 'POST', body: fd });
  if (r.ok) {
    form.reset();
    carregarTabela();
  } else {
    alert('Erro ao salvar terreno.');
  }
  return false;
}

async function alternarDisponibilidade(id, disponivelAtual) {
  await fetch(`/api/admin/terrenos/${id}/disponibilidade`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ disponivel: !disponivelAtual }),
  });
  carregarTabela();
}

async function excluirTerreno(id) {
  if (!confirm('Excluir este terreno permanentemente? Essa ação não pode ser desfeita.')) return;
  await fetch(`/api/admin/terrenos/${id}`, { method: 'DELETE' });
  carregarTabela();
}

async function carregarTabela() {
  const r = await fetch('/api/admin/terrenos');
  if (r.status === 401) { location.reload(); return; }
  const terrenos = await r.json();
  const tbody = document.getElementById('tabela-terrenos');

  tbody.innerHTML = terrenos.map(t => `
    <tr>
      <td><img class="thumb" src="${t.fotos[0] ? '/uploads/' + t.fotos[0] : 'https://via.placeholder.com/56x42?text=—'}"></td>
      <td>${t.titulo}${t.codigo ? '<br><span style="color:#5C665F;font-size:11.5px;">Cód. ' + t.codigo + '</span>' : ''}</td>
      <td>${[t.bairro, t.cidade].filter(Boolean).join(', ') || '—'}</td>
      <td>${fmtPreco(t.preco)}</td>
      <td>${t.visualizacoes}</td>
      <td><span class="status ${t.disponivel ? 'disp' : 'vend'}">${t.disponivel ? 'Disponível' : 'Vendido'}</span></td>
      <td class="acoes">
        <button class="btn btn-outline btn-sm" onclick="alternarDisponibilidade(${t.id}, ${t.disponivel})">
          ${t.disponivel ? 'Marcar vendido' : 'Reativar'}
        </button>
        <button class="btn btn-red btn-sm" onclick="excluirTerreno(${t.id})">Excluir</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="7" style="color:#5C665F;">Nenhum terreno cadastrado ainda.</td></tr>';
}

checarSessao();
</script>
</body>
</html>
