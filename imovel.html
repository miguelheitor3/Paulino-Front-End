<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imóvel — Paulino Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --green:#0C3B2C; --ink:#121815; --ink-soft:#5C665F; --line:#E3E7E2; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px;}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:28px;margin:16px 0 6px;}
  .preco{font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;color:var(--green);margin-bottom:16px;}
  .local{color:var(--ink-soft);margin-bottom:16px;}
  .specs{display:flex;gap:16px;margin-bottom:24px;font-size:13.5px;color:var(--ink-soft);font-weight:500;}
  .fotos{margin-bottom:24px;}
  .foto-principal{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#eee;}
  .foto-principal img{width:100%;height:100%;object-fit:cover;}
  .foto-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);border:0;font-size:20px;cursor:pointer;color:var(--ink);}
  .foto-nav.prev{left:14px;}
  .foto-nav.next{right:14px;}
  .foto-contador{position:absolute;bottom:14px;right:14px;background:rgba(18,24,21,.65);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;}
  .miniaturas{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px;}
  .miniaturas img{width:76px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;flex-shrink:0;opacity:.55;border:2px solid transparent;transition:opacity .15s ease,border-color .15s ease;}
  .miniaturas img.ativa{opacity:1;border-color:var(--green);}
  .desc{font-size:15px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;margin-bottom:28px;}
  .voltar{display:inline-block;margin-bottom:20px;font-size:13.5px;color:var(--green);font-weight:600;}
  .btn-whats{display:inline-block;background:var(--green);color:#fff;font-weight:600;font-size:14px;padding:14px 26px;border-radius:8px;}
</style>
</head>
<body>
<div class="wrap" id="conteudo">Carregando...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

async function carregar() {
  const el = document.getElementById("conteudo");
  if (!id) {
    el.innerHTML = '<a class="voltar" href="index.html">← Voltar</a><p>Imóvel não encontrado.</p>';
    return;
  }

  const { data: imovel, error } = await sb.from("imoveis").select("*").eq("id", id).eq("disponivel", true).single();
  if (error || !imovel) {
    el.innerHTML = '<a class="voltar" href="index.html">← Voltar</a><p>Este imóvel não está mais disponível.</p>';
    return;
  }

  // registra a visualização (não trava a página se falhar)
  sb.rpc("incrementar_visualizacao", { imovel_id: id }).then(() => {});

  const fotos = (imovel.fotos && imovel.fotos.length ? imovel.fotos : [null]).map(urlFoto);
  const specs = [];
  if (imovel.area_m2) specs.push(`${imovel.area_m2} m²`);
  if (imovel.quartos) specs.push(`${imovel.quartos} quartos`);
  if (imovel.banheiros) specs.push(`${imovel.banheiros} banheiros`);
  if (imovel.vagas) specs.push(`${imovel.vagas} vagas`);

  el.innerHTML = `
    <a class="voltar" href="index.html">← Voltar para o catálogo</a>
    <div class="fotos" id="galeria">
      <div class="foto-principal">
        ${fotos.length > 1 ? `
          <button type="button" class="foto-nav prev" aria-label="Foto anterior">&#8249;</button>
          <button type="button" class="foto-nav next" aria-label="Próxima foto">&#8250;</button>
          <span class="foto-contador" id="foto-contador">1 / ${fotos.length}</span>
        ` : ""}
        <img id="foto-principal-img" src="${fotos[0] || ""}" alt="${imovel.titulo}">
      </div>
      ${fotos.length > 1 ? `
        <div class="miniaturas" id="miniaturas">
          ${fotos.map((f, i) => `<img src="${f}" data-idx="${i}" class="${i === 0 ? "ativa" : ""}">`).join("")}
        </div>
      ` : ""}
    </div>
    <h1>${imovel.titulo}</h1>
    <div class="preco">${fmtPreco(imovel.preco)}</div>
    <div class="local">${[imovel.bairro, imovel.cidade].filter(Boolean).join(", ")}</div>
    ${specs.length ? `<div class="specs">${specs.join(" · ")}</div>` : ""}
    <div class="desc">${imovel.descricao || ""}</div>
    <a class="btn-whats" href="https://wa.me/5535998848963?text=Ol%C3%A1!%20Tenho%20interesse%20no%20im%C3%B3vel%20${encodeURIComponent(imovel.codigo || imovel.titulo)}" target="_blank" rel="noopener">Falar no WhatsApp sobre este imóvel</a>
  `;

  if (fotos.length > 1) {
    let idx = 0;
    const imgPrincipal = document.getElementById("foto-principal-img");
    const contador = document.getElementById("foto-contador");
    const miniaturas = [...document.querySelectorAll("#miniaturas img")];

    function mostrarFoto(novoIdx) {
      idx = (novoIdx + fotos.length) % fotos.length;
      imgPrincipal.src = fotos[idx];
      contador.textContent = `${idx + 1} / ${fotos.length}`;
      miniaturas.forEach((m, i) => m.classList.toggle("ativa", i === idx));
    }

    document.querySelector(".foto-nav.prev").addEventListener("click", () => mostrarFoto(idx - 1));
    document.querySelector(".foto-nav.next").addEventListener("click", () => mostrarFoto(idx + 1));
    miniaturas.forEach(m => m.addEventListener("click", () => mostrarFoto(Number(m.dataset.idx))));
  }
}
carregar();
</script>
</body>
</html>
