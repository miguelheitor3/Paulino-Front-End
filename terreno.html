<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terreno — Paulino Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --green:#0C3B2C; --ink:#121815; --ink-soft:#5C665F; --line:#E3E7E2; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px;}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:28px;margin:16px 0 6px;}
  .preco{font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;color:var(--green);margin-bottom:16px;}
  .local{color:var(--ink-soft);margin-bottom:24px;}
  .fotos{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:24px;}
  .fotos img{width:100%;height:100%;object-fit:cover;border-radius:10px;background:#eee;}
  .fotos .principal{grid-row:span 2;aspect-ratio:4/3;}
  .desc{font-size:15px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;}
  .voltar{display:inline-block;margin-bottom:20px;font-size:13.5px;color:var(--green);font-weight:600;}
</style>
</head>
<body>
<div class="wrap" id="conteudo">Carregando...</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');

const fmtPreco = (v) => v == null ? 'Sob consulta' :
  v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

async function carregar() {
  const el = document.getElementById('conteudo');
  const r = await fetch(`/api/terrenos/${id}`);
  if (!r.ok) {
    el.innerHTML = '<a class="voltar" href="/terrenos.html">← Voltar</a><p>Este terreno não está mais disponível.</p>';
    return;
  }
  const t = await r.json();
  const fotos = t.fotos.length ? t.fotos : [];
  el.innerHTML = `
    <a class="voltar" href="/terrenos.html">← Voltar para o catálogo</a>
    <div class="fotos">
      ${fotos[0] ? `<img class="principal" src="/uploads/${fotos[0]}">` : ''}
      ${fotos.slice(1, 3).map(f => `<img src="/uploads/${f}">`).join('')}
    </div>
    <h1>${t.titulo}</h1>
    <div class="preco">${fmtPreco(t.preco)}</div>
    <div class="local">${[t.bairro, t.cidade].filter(Boolean).join(', ')} ${t.area_m2 ? '· ' + t.area_m2 + ' m²' : ''}</div>
    <div class="desc">${t.descricao || ''}</div>
  `;
}
carregar();
</script>
</body>
</html>
