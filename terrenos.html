<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terrenos à venda — Paulino Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0C3B2C; --green-dark:#082B20; --green-tint:#E8EFEA;
    --red:#C81E2C; --white:#FFFFFF; --offwhite:#F6F7F5;
    --ink:#121815; --ink-soft:#5C665F; --line:#E3E7E2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--white);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
  .display{font-family:'Archivo',sans-serif;}
  .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--green);}

  .section{padding:56px 0 88px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;}
  .section-head h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:box-shadow .2s ease,transform .2s ease;cursor:pointer;}
  .card:hover{box-shadow:0 18px 40px rgba(12,24,18,.1);transform:translateY(-2px);}
  .card-photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:#eee;}
  .card-photo img{width:100%;height:100%;object-fit:cover;}
  .tag-destaque{position:absolute;top:14px;left:14px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:5px 11px;border-radius:6px;}
  .card-body{padding:18px 20px 20px;}
  .card-price{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;}
  .card-code{font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .card-title{font-size:14px;font-weight:600;margin-top:10px;}
  .card-place{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .card-specs{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);font-weight:500;}
  .empty{color:var(--ink-soft);font-size:14px;padding:24px 0;}

  @media (max-width:960px){ .grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<section class="section">
  <div class="wrap">
    <span class="eyebrow">Mais procurados</span>
    <div class="section-head">
      <h2>Terrenos em destaque</h2>
    </div>
    <div class="grid" id="grid-destaques"></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <span class="eyebrow">Catálogo completo</span>
    <div class="section-head">
      <h2>Todos os terrenos disponíveis</h2>
    </div>
    <div class="grid" id="grid-todos"></div>
  </div>
</section>

<script>
const fmtPreco = (v) => v == null ? 'Sob consulta' :
  v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

function cardHtml(t, destaque) {
  const foto = t.fotos[0] ? `/uploads/${t.fotos[0]}` : 'https://via.placeholder.com/600x450?text=Sem+foto';
  return `
    <div class="card" onclick="abrirTerreno(${t.id})">
      <div class="card-photo">
        ${destaque ? '<span class="tag-destaque">Destaque</span>' : ''}
        <img src="${foto}" alt="${t.titulo}">
      </div>
      <div class="card-body">
        <div class="card-price">${fmtPreco(t.preco)}</div>
        <div class="card-code">${t.codigo ? 'Código ' + t.codigo : ''}</div>
        <div class="card-title">${t.titulo}</div>
        <div class="card-place">${[t.bairro, t.cidade].filter(Boolean).join(', ')}</div>
        <div class="card-specs">${t.area_m2 ? `<span>${t.area_m2} m²</span>` : ''}</div>
      </div>
    </div>`;
}

function abrirTerreno(id) {
  // registra a visualizacao e leva para a pagina de detalhe
  fetch(`/api/terrenos/${id}/visualizar`, { method: 'POST' }).finally(() => {
    window.location.href = `/terreno.html?id=${id}`;
  });
}

async function carregar() {
  const [destaques, todos] = await Promise.all([
    fetch('/api/terrenos/destaques?limite=3').then(r => r.json()),
    fetch('/api/terrenos').then(r => r.json()),
  ]);

  const gridDestaques = document.getElementById('grid-destaques');
  gridDestaques.innerHTML = destaques.length
    ? destaques.map(t => cardHtml(t, true)).join('')
    : '<div class="empty">Nenhum terreno em destaque no momento.</div>';

  const gridTodos = document.getElementById('grid-todos');
  gridTodos.innerHTML = todos.length
    ? todos.map(t => cardHtml(t, false)).join('')
    : '<div class="empty">Nenhum terreno disponível no momento.</div>';
}

carregar();
</script>
</body>
</html>
